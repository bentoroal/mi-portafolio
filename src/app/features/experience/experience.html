<section class="experience-section">
  <div class="container">
    <!-- Header -->
    <div class="section-header">
      <div class="accent-line"></div>
      <h1>Experiencia Laboral</h1>
      <p class="section-subtitle">Mi trayectoria profesional en desarrollo de software</p>
    </div>

      <!-- Primary Experience Card -->
      <app-card-item
        [title]="'Desarrollador Full Stack Freelance'"
        [institution]="'Aela SpA'"
        [period]="'2025'"
        [description]="'Desarrollo de aplicaciones móviles y sistemas web como parte de proyectos freelance para Aela SPA, combinando tecnologías modernas y enfoque Full Stack.'"
        [achievements]="[
          'Desarrollo de App de clima: integración con GPS y API meteorológica, alertas personalizadas y diseño moderno.',
          'Implementación de sistema web para gestión de clientes y generación automatizada de escritos judiciales, utilizando plantillas dinámicas y validación de datos.',
        ]"
        [isPrimary]="true"
      ></app-card-item>

      <!-- Secondary Experience Card -->
      <app-card-item
        [title]="'Práctica Profesional Desarrollador Full Stack'"
        [institution]="'Isamax'"
        [period]="'2025'"
        [description]="'Desarrollo de aplicación web, frontend y backend, junto a Base de Datos y Apis de aplicación de transporte de pasajeros tipo uber para sectores rurales con baja estabilidad de internet'"
        [achievements]="[
          'Integración de herramientas de Google Cloud (Auth y Maps)',
          'Implementación de georeferenciación de usuarios para coordinar viajes',
          'Evaluación: Excelente profesional, capaz de proponer soluciones avanzadas'
        ]"
        [collapsible]="true"
      ></app-card-item>

  </div>
</section>
